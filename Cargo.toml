[package]
name = "corba"
version = "0.3.0"
description = "Library to implement GIOP services and clients"
edition = "2024"
rust-version = "1.85"

[dependencies]
embedded-nal = "0.9.0"
log = "0.4.35"
nb = "1.1.0"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }

[features]
default = ["std"]
std = ["serde/std"]

[dev-dependencies]
simple_logger = { version = "5.2.0", default-features = false, features = ["colors"] }
