[package]
name = "corba"
version = "0.2.0"
authors = ["Romain Déoux <romain.deoux@flowbird.group>"]
description = "Library to implement GIOP services and clients"
edition = "2021"

[dependencies]
embedded-nal = "0.8.0"
log = "0.4.20"
nb = "1.1.0"
serde = { version = "1.0.195", default-features = false, features = ["alloc", "derive"] }

[features]
default = ["std"]
std = ["serde/std"]

[dev-dependencies]
simple_logger = { version = "4.3.3", default-features = false, features = ["colors"] }
