[package]
name = "corba"
version = "0.1.0"
authors = ["Romain Déoux <ext-romain.deoux@flowbird.group>"]
description = "Library to implement GIOP services and clients"
edition = "2018"

[dependencies]
embedded-nal = "0.6.0"
log = "0.4.14"
nb = "1.0.0"
serde = { version = "1.0.130", default_features = false, features = ["alloc", "derive"] }

[features]
default = []
std = ["serde/std"]

[dev-dependencies]
simple_logger = "1.13.0"
